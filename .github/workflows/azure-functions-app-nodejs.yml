# Tên của workflow
name: Deploy NestJS SERVER to Azure App Service

# Kích hoạt workflow khi có push lên branch 'main'
on:
  push:
    branches: [ "main" ]

# Định nghĩa các biến môi trường
env:
  AZURE_APP_NAME: "nestjs-sep490-kkk"      
  AZURE_RESOURCE_GROUP: "nestjs-rg"         
  NODE_VERSION: "20.x"                    

# Các công việc (jobs) cần chạy
jobs:
  build-and-deploy-server:
    runs-on: ubuntu-latest
    
    steps:
    # Bước 1: Checkout code từ repo
    - name: Checkout code
      uses: actions/checkout@v3

    # Bước 2: Cài đặt Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json 

    # Bước 3: Cài đặt dependencies cho server
    - name: npm install (server)
      run: npm install
      working-directory: ./server
      
    # Bước tạo Prisma Client (Quan trọng để không lỗi build)
    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./server

    # Bước 4: Build project NestJS (server)
    - name: npm build (server)
      run: npm run build
      working-directory: ./server

    # Bước 5: Xóa devDependencies (server)
      # Giúp file upload nhẹ hơn
    - name: Prune production dependencies (server)
      run: npm prune --production
      working-directory: ./server

    # --- 👇 SỬA ĐỔI TỪ ĐÂY 👇 ---
    
    # Đã XÓA bước "Login to Azure" (không cần nữa)

    # Bước 6: Deploy lên Azure App Service dùng Publish Profile
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_APP_NAME }}
        # Chỉ định deploy nội dung của thư mục 'server'
        package: ./server 
        # 👇 QUAN TRỌNG: Dùng Secret chứa nội dung file XML bạn vừa tải về
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        
    # Đã XÓA bước "Logout" (không cần nữa)
