name: Deploy NestJS SERVER to Azure App Service

on:
  push:
    branches: [ "main" ]

env:
  AZURE_APP_NAME: "nestjs-sep490-kkk"       # Tên App Service của bạn
  AZURE_RESOURCE_GROUP: "nestjs-rg"         # Resource Group
  NODE_VERSION: "20.x"                      # Node Version

jobs:
  build-and-deploy-server:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Lấy code về
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Cài Node.js trên GitHub Runner
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    # 3. Test Build trên GitHub Runner
    # Bước này để đảm bảo code của bạn không bị lỗi cú pháp trước khi đẩy đi
    # Nhưng ta KHÔNG dùng kết quả build này để deploy
    - name: Install and Build (Check)
      run: |
        npm install
        npm run build
      working-directory: ./server

    # 4. DỌN DẸP (Bước quan trọng nhất để fix lỗi)
    # Xóa sạch node_modules và dist để gửi code sạch lên Azure
    - name: Clean artifacts before deploy
      run: |
        rm -rf node_modules
        rm -rf dist
      working-directory: ./server

    # 5. Đăng nhập Azure
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 6. Deploy code sạch lên Azure
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_APP_NAME }}
        package: ./server 
        # Biến này bắt buộc Azure phải tự chạy npm install và build lại từ đầu
        # Đảm bảo bcrypt và prisma chạy đúng trên môi trường đích
    
    # 7. Đăng xuất
    - name: Logout from Azure
      run: az logout
